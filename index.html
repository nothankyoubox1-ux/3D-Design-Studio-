<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Design Studio</title>
<script type="importmap">
{"imports":{
 "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
 "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<style>
:root{--bg:#14171c;--panel:#1c2027;--line:#2d333d;--text:#e6e9ee;--dim:#8d96a5;--accent:#e0a458;font-family:"Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;height:100dvh;display:grid;grid-template-rows:auto 1fr auto;background:var(--bg);color:var(--text);font-size:14px}
header{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:15px;margin:0 10px 0 0;font-weight:600}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
button,select,input{font:inherit;color:var(--text);background:#262b34;border:1px solid var(--line);border-radius:4px;padding:5px 9px}
button{cursor:pointer}button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
main{display:grid;grid-template-columns:200px 1fr 260px;min-height:0}
aside{background:var(--panel);overflow:auto;padding:10px}
#left{border-right:1px solid var(--line)}#right{border-left:1px solid var(--line)}
aside h2{font-size:12px;color:var(--dim);margin:0 0 8px;font-weight:600}
#view{position:relative;min-height:0;touch-action:none}
#view canvas{display:block;width:100%;height:100%}
.item{padding:6px 8px;border-radius:4px;cursor:pointer}
.item.sel{background:#2d3441;outline:1px solid var(--accent)}
.row{display:grid;grid-template-columns:1fr 90px;gap:6px;align-items:center;margin-bottom:6px}
.row input{width:100%}
.dim{color:var(--dim)}
footer{padding:6px 10px;background:var(--panel);border-top:1px solid var(--line);display:flex;gap:16px;flex-wrap:wrap}
#err{color:#ff8a80}
@media(max-width:800px){
 main{grid-template-columns:1fr;grid-template-rows:55vh auto auto}
 #view{order:1}#left{order:2;border:0}#right{order:3;border:0}
}
</style>
</head>
<body>
<header id="bar"></header>
<main>
 <aside id="left"></aside>
 <div id="view"></div>
 <aside id="right"></aside>
</main>
<footer><span id="stats"></span><span id="status" class="dim"></span><span id="err"></span></footer>
<script type="module" src="./main.js"></script>
</body>
</html>
